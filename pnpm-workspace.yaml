# pnpm 11+ reads `allowBuilds`; older pnpm (possibly Netlify's) reads
# `onlyBuiltDependencies`. Keep both lists in sync.
allowBuilds:
  "@tailwindcss/oxide": true
  esbuild: true
  sharp: true
  unrs-resolver: true

onlyBuiltDependencies:
  - "@tailwindcss/oxide"
  - esbuild
  - sharp
  - unrs-resolver
